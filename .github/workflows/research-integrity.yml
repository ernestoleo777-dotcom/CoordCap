name: ResearchAuditKit integrity preflight

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - id: audit
        name: Run mechanical repository audit
        # ResearchAuditKit v0.1.0-rc.3
        uses: ernestoleo777-dotcom/ResearchAuditKit@72ee132038a36d8678da11e86d3b953726a5e9a7
        with:
          path: .
          policy: .rak/policy.yaml
          fail-on: release-blocker
          output-format: json

      - name: Require aggregate PASS
        shell: bash
        env:
          RAK_STATUS: ${{ steps.audit.outputs.status }}
        run: test "$RAK_STATUS" = "PASS"
